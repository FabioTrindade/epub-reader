<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>EPUB Reader — leitura bilíngue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E📖%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#viewport">Pular para o conteúdo</a>

<header class="app-header">
  <div class="header-start">
    <button id="btn-sidebar" class="icon-btn" aria-label="Abrir sumário" aria-expanded="false" title="Sumário">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>
    <button id="btn-back" class="icon-btn" aria-label="Voltar à biblioteca" title="Biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="app-title">
      <h1 id="book-title">EPUB Reader</h1>
      <p id="book-subtitle" class="muted"></p>
    </div>
  </div>

  <div class="mode-switch" id="mode-switch" role="group" aria-label="Modo de leitura">
    <button data-mode="original" class="is-active" aria-pressed="true">Original</button>
    <button data-mode="split" aria-pressed="false">Lado a lado</button>
    <button data-mode="translated" aria-pressed="false">Tradução</button>
  </div>

  <div class="header-end">
    <!-- Só durante a tradução; clicar oferece o "Cancelar tradução". -->
    <button id="translate-status" class="translate-status" hidden aria-haspopup="menu" aria-expanded="false">
      <span class="status-dot" aria-hidden="true"></span><span id="translate-label">Traduzindo…</span>
    </button>
    <button class="icon-btn aa-btn" data-action="appearance" aria-label="Aparência" title="Aparência">Aa</button>
    <button id="btn-library" class="icon-btn" aria-label="Biblioteca" title="Biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.6-.9 3 15.4-3.6.9z"/></svg>
    </button>
    <button id="btn-more" class="icon-btn" aria-label="Mais opções" title="Notificações e ajuda" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-fill"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span id="more-dot" class="more-dot" hidden></span>
    </button>
  </div>

  <div id="translate-line" class="translate-line" hidden><span id="translate-progress"></span></div>
</header>

<div id="menu-more" class="menu" role="menu" aria-label="Mais opções" hidden>
  <button role="menuitem" id="btn-notifications">
    <span>Notificações</span><span id="notif-badge" class="badge" hidden>0</span>
  </button>
  <button role="menuitem" id="menu-copy-diagnostic">Copiar diagnóstico</button>
  <a role="menuitem" href="https://github.com/FabioTrindade/epub-reader#como-usar" target="_blank" rel="noopener">Ajuda</a>
</div>

<div id="menu-translate" class="menu" role="menu" aria-label="Tradução em andamento" hidden>
  <button role="menuitem" id="btn-cancel-translate">Cancelar tradução</button>
</div>

<div class="app-body">
  <div id="sidebar-scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="Sumário e marcadores">
    <div class="sidebar-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-panel="toc">Capítulos</button>
      <button role="tab" aria-selected="false" data-panel="bookmarks">Trechos salvos</button>
    </div>
    <div class="sidebar-search">
      <input id="toc-filter" type="search" placeholder="Filtrar capítulos…" aria-label="Filtrar capítulos">
    </div>
    <nav id="panel-toc" class="sidebar-panel" role="tabpanel"></nav>
    <div id="panel-bookmarks" class="sidebar-panel" role="tabpanel" hidden></div>
  </aside>

  <main class="reading-area">
    <div id="mobile-tabs" class="mobile-tabs" hidden role="group" aria-label="Original ou tradução">
      <button data-mobile-mode="original" class="is-active" aria-pressed="true">Original</button>
      <button data-mobile-mode="translated" aria-pressed="false">Tradução</button>
    </div>

    <div id="viewport" class="viewport" tabindex="-1"></div>

    <button id="btn-goto-mark" class="goto-mark" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg>
      <span>Voltar para onde parei</span>
    </button>

    <section id="welcome" class="welcome">
      <div class="drop-zone" id="drop-zone">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="drop-icon"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <h2>Abra um livro em EPUB</h2>
        <p class="muted">Arraste o arquivo aqui ou escolha no seu computador.<br>
          Nada é enviado para servidor: o livro é lido e guardado no seu navegador.</p>
        <label class="primary-btn">
          Escolher arquivo
          <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
        </label>
      </div>
      <div id="library" class="library"></div>
    </section>
  </main>
</div>

<footer class="app-footer">
  <button id="btn-toc" class="icon-btn" aria-label="Abrir sumário" title="Sumário">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
  </button>
  <button id="btn-prev" class="nav-btn" aria-label="Capítulo anterior">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="nav-label">Anterior</span>
  </button>
  <div class="footer-center">
    <div class="footer-status">
      <span id="chapter-label" class="muted">—</span>
      <span id="chapter-label-short" class="muted" aria-hidden="true"></span>
      <!-- "Parei aqui" sem seleção: marca o parágrafo do topo da tela. -->
      <button id="btn-mark" class="mark-btn"
              aria-label="Parei aqui: marcar o parágrafo do topo da tela"
              title="Parei aqui — sem seleção, marca o parágrafo do topo. (M)">
        <svg class="icon-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h7M4 17h11"/><path d="M19 9v9m0 0l-2.5-2.5M19 18l2.5-2.5"/></svg>
        <svg class="icon-unmark" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 7h11M4 12h7M4 17h11"/><path d="M16 9l6 6m0-6l-6 6"/></svg>
      </button>
    </div>
    <div class="progress thin"><div id="reading-progress" class="progress-fill"></div></div>
  </div>
  <button id="btn-next" class="nav-btn" aria-label="Próximo capítulo">
    <span class="nav-label">Próximo</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</footer>

<!-- Ações do trecho selecionado: aparecem junto da seleção. -->
<div id="selection-bar" class="selection-bar" role="toolbar" aria-label="Ações do trecho selecionado" hidden>
  <button id="sel-mark"><span class="mark-swatch" aria-hidden="true"></span><span class="sel-mark-label">Parei aqui</span></button>
  <button id="sel-save">Salvar</button>
  <button id="sel-copy">Copiar</button>
</div>

<!-- Notificações: o painel de diagnóstico -->
<dialog id="dlg-notifications" class="dialog">
  <div class="dialog-head">
    <h2>Notificações</h2>
    <button class="icon-btn" data-close aria-label="Fechar">&times;</button>
  </div>
  <div id="notif-list" class="notif-list"></div>
  <div class="dialog-actions">
    <button id="btn-copy-diagnostic" class="text-btn">Copiar diagnóstico</button>
    <button id="btn-clear-notifications" class="text-btn">Limpar</button>
  </div>
</dialog>

<dialog id="dlg-settings" class="dialog">
  <div class="dialog-head">
    <h2>Configurações</h2>
    <button class="icon-btn" data-close aria-label="Fechar">&times;</button>
  </div>

  <div class="settings">
    <label class="field">
      <span>Tamanho da fonte <output id="out-font-size"></output></span>
      <input type="range" id="set-font-size" min="14" max="28" step="1">
    </label>

    <label class="field">
      <span>Altura da linha <output id="out-line-height"></output></span>
      <input type="range" id="set-line-height" min="1.3" max="2.2" step="0.1">
    </label>

    <label class="field">
      <span>Fonte</span>
      <select id="set-font-family">
        <option value="serif">Serifada</option>
        <option value="sans">Sem serifa</option>
      </select>
    </label>

    <label class="field">
      <span>Cor do marcador "parei aqui"</span>
      <select id="set-mark-color">
        <option value="amber">Âmbar</option>
        <option value="green">Verde</option>
        <option value="blue">Azul</option>
        <option value="pink">Rosa</option>
        <option value="purple">Roxo</option>
      </select>
      <span class="mark-preview" aria-hidden="true">Assim ficará a linha marcada.</span>
    </label>

    <label class="field">
      <span>Tema</span>
      <select id="set-theme">
        <option value="system">Seguir o sistema</option>
        <option value="light">Claro</option>
        <option value="dark">Escuro</option>
      </select>
    </label>

    <label class="field">
      <span>Traduzir para</span>
      <select id="set-target-lang">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="pt-PT">Português (Portugal)</option>
        <option value="es">Espanhol</option>
        <option value="fr">Francês</option>
        <option value="de">Alemão</option>
        <option value="it">Italiano</option>
      </select>
    </label>

    <div class="field">
      <span>Armazenamento</span>
      <p id="storage-info" class="muted small">—</p>
      <button id="btn-clear-cache" class="text-btn">Limpar cache de traduções deste livro</button>
    </div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="lib/jszip.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
