<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>EPUB Reader — leitura bilíngue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E📖%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#viewport">Pular para o conteúdo</a>

<header class="app-header">
  <button id="btn-sidebar" class="icon-btn" aria-label="Abrir sumário" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div class="app-title">
    <h1 id="book-title">EPUB Reader</h1>
    <p id="book-author" class="muted"></p>
  </div>

  <div class="toolbar">
    <div class="mode-switch" id="mode-switch" role="group" aria-label="Modo de leitura">
      <button data-mode="original" class="is-active">Original</button>
      <button data-mode="split" class="split-only">Lado a lado</button>
      <button data-mode="translated">Traduzido</button>
    </div>

    <button id="btn-library" class="icon-btn" aria-label="Minha biblioteca" title="Biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5V21h16"/></svg>
    </button>

    <button id="btn-notifications" class="icon-btn" aria-label="Notificações" title="Notificações">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="notif-badge" class="badge" hidden>0</span>
    </button>

    <button id="btn-settings" class="icon-btn" aria-label="Configurações" title="Configurações">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>

    <button id="btn-theme" class="icon-btn" aria-label="Alternar tema" title="Tema">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="app-body">
  <div id="sidebar-scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="Sumário e marcadores">
    <div class="sidebar-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-panel="toc">Capítulos</button>
      <button role="tab" aria-selected="false" data-panel="bookmarks">Trechos salvos</button>
    </div>
    <div class="sidebar-search">
      <input id="toc-filter" type="search" placeholder="Filtrar capítulos…" aria-label="Filtrar capítulos">
    </div>
    <nav id="panel-toc" class="sidebar-panel" role="tabpanel"></nav>
    <div id="panel-bookmarks" class="sidebar-panel" role="tabpanel" hidden></div>
  </aside>

  <main class="reading-area">
    <div id="translate-bar" class="translate-bar" hidden>
      <div class="progress"><div id="translate-progress" class="progress-fill"></div></div>
      <span id="translate-label">Traduzindo…</span>
      <button id="btn-cancel-translate" class="text-btn">Cancelar</button>
    </div>

    <div id="mobile-tabs" class="mobile-tabs" hidden role="group" aria-label="Original ou tradução">
      <button data-mobile-mode="original" class="is-active">Original</button>
      <button data-mobile-mode="translated">Traduzido</button>
    </div>

    <div id="viewport" class="viewport" tabindex="-1"></div>

    <button id="btn-goto-mark" class="goto-mark" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg>
      <span>Voltar para onde parei</span>
    </button>

    <section id="welcome" class="welcome">
      <div class="drop-zone" id="drop-zone">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="drop-icon"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <h2>Abra um livro em EPUB</h2>
        <p class="muted">Arraste o arquivo aqui ou escolha no seu computador.<br>
          Nada é enviado para servidor: o livro é lido e guardado no seu navegador.</p>
        <label class="primary-btn">
          Escolher arquivo
          <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
        </label>
      </div>
      <div id="library" class="library"></div>
    </section>
  </main>
</div>

<footer class="app-footer">
  <button id="btn-prev" class="nav-btn" aria-label="Capítulo anterior">&#9664;</button>
  <div class="footer-center">
    <span id="chapter-label" class="muted">—</span>
    <div class="progress thin"><div id="reading-progress" class="progress-fill"></div></div>
  </div>
  <button id="btn-mark" class="footer-action is-mark"
          aria-label="Parei aqui: marcar o trecho selecionado"
          title="Parei aqui — selecione um trecho e clique. Sem seleção, marca o parágrafo do topo. (M)">
    <svg class="icon-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h7M4 17h11"/><path d="M19 9v9m0 0l-2.5-2.5M19 18l2.5-2.5"/></svg>
    <svg class="icon-unmark" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 7h11M4 12h7M4 17h11"/><path d="M16 9l6 6m0-6l-6 6"/></svg>
    <span class="btn-label">Parei aqui</span>
  </button>
  <button id="btn-bookmark" class="footer-action"
          aria-label="Salvar este trecho na lista lateral"
          title="Salvar trecho — guarda na aba Trechos salvos (B)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span class="btn-label">Salvar trecho</span>
  </button>
  <button id="btn-next" class="nav-btn" aria-label="Próximo capítulo">&#9654;</button>
</footer>

<!-- Notificações: o painel de diagnóstico -->
<dialog id="dlg-notifications" class="dialog">
  <div class="dialog-head">
    <h2>Notificações</h2>
    <button class="icon-btn" data-close aria-label="Fechar">&times;</button>
  </div>
  <div id="notif-list" class="notif-list"></div>
  <div class="dialog-actions">
    <button id="btn-copy-diagnostic" class="text-btn">Copiar diagnóstico</button>
    <button id="btn-clear-notifications" class="text-btn">Limpar</button>
  </div>
</dialog>

<dialog id="dlg-settings" class="dialog">
  <div class="dialog-head">
    <h2>Configurações</h2>
    <button class="icon-btn" data-close aria-label="Fechar">&times;</button>
  </div>

  <div class="settings">
    <label class="field">
      <span>Tamanho da fonte <output id="out-font-size"></output></span>
      <input type="range" id="set-font-size" min="14" max="28" step="1">
    </label>

    <label class="field">
      <span>Altura da linha <output id="out-line-height"></output></span>
      <input type="range" id="set-line-height" min="1.3" max="2.2" step="0.1">
    </label>

    <label class="field">
      <span>Fonte</span>
      <select id="set-font-family">
        <option value="serif">Serifada</option>
        <option value="sans">Sem serifa</option>
      </select>
    </label>

    <label class="field">
      <span>Cor do marcador "parei aqui"</span>
      <select id="set-mark-color">
        <option value="amber">Âmbar</option>
        <option value="green">Verde</option>
        <option value="blue">Azul</option>
        <option value="pink">Rosa</option>
        <option value="purple">Roxo</option>
      </select>
      <span class="mark-preview" aria-hidden="true">Assim ficará a linha marcada.</span>
    </label>

    <label class="field">
      <span>Tema</span>
      <select id="set-theme">
        <option value="system">Seguir o sistema</option>
        <option value="light">Claro</option>
        <option value="dark">Escuro</option>
      </select>
    </label>

    <label class="field">
      <span>Traduzir para</span>
      <select id="set-target-lang">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="pt-PT">Português (Portugal)</option>
        <option value="es">Espanhol</option>
        <option value="fr">Francês</option>
        <option value="de">Alemão</option>
        <option value="it">Italiano</option>
      </select>
    </label>

    <div class="field">
      <span>Armazenamento</span>
      <p id="storage-info" class="muted small">—</p>
      <button id="btn-clear-cache" class="text-btn">Limpar cache de traduções deste livro</button>
    </div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="lib/jszip.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
